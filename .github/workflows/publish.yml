name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, such as v2.3.9"
        required: true

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # Node 24 ships npm 11, which supports trusted publishing.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Check the tag and the published versions
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag ${TAG} does not match package.json version ${version}."
            exit 1
          fi
          if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
            echo "${name}@${version} is already on npm. Skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Build
        if: steps.check.outputs.publish == 'true'
        run: npm run build

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        run: npm publish --access public
