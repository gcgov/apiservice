name: Dependabot merge and release

# After CI passes on a Dependabot pull request, this workflow merges the pull request when every update
# in it is a patch or minor version update. Dependabot security updates at those levels qualify too.
# When the update changes a production dependency in package.json, the workflow then bumps the patch
# version, rebuilds dist, tags a release, publishes a GitHub release, and starts the npm publish workflow.
#
# The workflow merges and releases in one job on purpose. A merge, a tag or a release that GITHUB_TOKEN
# makes does not start other workflows, so a separate release workflow on "push" never runs after the
# merge. The one exception is workflow_dispatch, which this workflow uses to start publish.yml.
#
# The trigger is workflow_run, not pull_request. Dependabot runs pull_request workflows with a
# read-only token. This workflow runs from the default branch and never checks out pull request code.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

# One merge and release at a time, so two pull requests never compute the same version number
concurrency:
  group: dependabot-release
  cancel-in-progress: false

jobs:
  merge-and-release:
    name: Merge and release
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Find the pull request
        id: pr
        run: |
          pr=$(gh pr list --head "$HEAD_BRANCH" --state open --json number,headRefOid,author \
            --jq '.[] | select(.author.is_bot and (.author.login | test("dependabot"))) | "\(.number) \(.headRefOid)"')
          if [ -z "$pr" ]; then
            echo "No open Dependabot pull request for $HEAD_BRANCH. Nothing to do."
            exit 0
          fi
          read -r number head <<< "$pr"
          if [ "$head" != "$HEAD_SHA" ]; then
            echo "Pull request #$number has a newer commit than the one CI checked. CI runs again for it."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Check the update types
        id: check
        if: steps.pr.outputs.number
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # Every commit must come from Dependabot. A commit from someone else needs a human review.
          others=$(gh api "repos/$GH_REPO/pulls/$NUMBER/commits" --paginate \
            --jq '[.[] | select(.author.login != "dependabot[bot]")] | length')
          if [ "$others" != "0" ]; then
            echo "Pull request #$NUMBER has commits from someone other than Dependabot. Leave it for review."
            exit 0
          fi

          # Dependabot writes a YAML block in each commit message, with an update-type and a
          # dependency-type for each dependency it updates.
          gh api "repos/$GH_REPO/pulls/$NUMBER/commits" --paginate --jq '.[].commit.message' > messages.txt
          types=$(grep -oE 'update-type: version-update:semver-[a-z]+' messages.txt | sort -u || true)
          echo "Update types:"
          echo "$types"

          if [ -z "$types" ]; then
            echo "No update type in the commit messages. Leave the pull request for review."
            exit 0
          fi
          if echo "$types" | grep -qv -E 'semver-(minor|patch)$'; then
            echo "The pull request has a major update. Leave it for review."
            exit 0
          fi
          echo "merge=true" >> "$GITHUB_OUTPUT"

          # Only a production dependency in package.json changes what an application gets
          # when it installs this library.
          if [[ "$HEAD_BRANCH" == dependabot/npm_and_yarn/* ]] && grep -q 'dependency-type: direct:production' messages.txt; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge the pull request
        id: merge
        if: steps.check.outputs.merge == 'true'
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          # --match-head-commit refuses the merge if the branch moved after CI checked it
          gh pr merge "$NUMBER" --squash --match-head-commit "$HEAD_SHA"
          sha=$(gh pr view "$NUMBER" --json mergeCommit --jq '.mergeCommit.oid')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the merge commit
        if: steps.check.outputs.release == 'true' && steps.merge.outputs.sha
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.merge.outputs.sha }}
          fetch-depth: 0

      - name: Set up Node
        if: steps.check.outputs.release == 'true' && steps.merge.outputs.sha
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Bump the version, tag, and publish a patch release
        if: steps.check.outputs.release == 'true' && steps.merge.outputs.sha
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          latest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ -z "$latest" ]; then
            echo "::error::No vX.Y.Z tag found to compute the next version from."
            exit 1
          fi
          # Start from package.json when someone raised the version there without a tag yet.
          current=$(printf '%s\n%s\n' "${latest#v}" "$(node -p "require('./package.json').version")" | sort -V | tail -n 1)
          IFS=. read -r major minor patch <<< "$current"
          next="v$major.$minor.$((patch + 1))"
          echo "Latest tag $latest. Next tag $next."

          # package.json holds the version npm publishes, and the repository commits dist,
          # so the release needs a commit on main.
          npm ci
          npm version "${next#v}" --no-git-tag-version
          npm run build

          title=$(gh pr view "$NUMBER" --json title --jq '.title')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist
          git commit -m "bump version to ${next#v}" -m "Dependency update: $title (#$NUMBER)"
          git tag -a "$next" -m "$next"

          # --atomic pushes the commit and the tag together or not at all. The push fails if main
          # moved after the merge, so the release never skips a commit on main.
          git push --atomic origin HEAD:main "refs/tags/$next"

          gh release create "$next" \
            --verify-tag \
            --title "$next" \
            --notes-start-tag "$latest" \
            --generate-notes \
            --notes "Dependency update: $title (#$NUMBER)"

          gh workflow run publish.yml --ref "$next" -f tag="$next"
